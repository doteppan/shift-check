<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"></head><body><title>シフトチェック</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f4f2; --surface:#ffffff; --surface-2:#e9ebe8; --line:#d8dcd9; --line-soft:#e6e9e6;
  --ink:#1b232c; --ink-2:#4f5963; --ink-3:#7b858f;
  --accent:#1f5fa8; --accent-soft:#dce8f7;
  --over:#c93f3a; --over-soft:#f7dedb; --under:#3f7fc4; --under-soft:#dde9f6; --ok:#2f8a5b; --ok-soft:#dcefe3; --warn:#b9770e; --warn-soft:#f6e9cf;
  --bar-actual:#2a78d6; --bar-over:#e34948; --bar-recruit:#9fc0ea; --pat:#1b232c;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191d; --surface:#1e2429; --surface-2:#262d33; --line:#38424b; --line-soft:#2c343b;
    --ink:#eef1f3; --ink-2:#b7c0c8; --ink-3:#87919b;
    --accent:#6ea7ea; --accent-soft:#1f2f45;
    --over:#ef7b74; --over-soft:#4a2320; --under:#7fb2ea; --under-soft:#1f3349; --ok:#6cc292; --ok-soft:#1d3a2a; --warn:#e2b04a; --warn-soft:#42341a;
    --bar-actual:#3987e5; --bar-over:#e66767; --bar-recruit:#4f6f95; --pat:#eef1f3;
  }
}
:root[data-theme="dark"]{
  --bg:#15191d; --surface:#1e2429; --surface-2:#262d33; --line:#38424b; --line-soft:#2c343b;
  --ink:#eef1f3; --ink-2:#b7c0c8; --ink-3:#87919b;
  --accent:#6ea7ea; --accent-soft:#1f2f45;
  --over:#ef7b74; --over-soft:#4a2320; --under:#7fb2ea; --under-soft:#1f3349; --ok:#6cc292; --ok-soft:#1d3a2a; --warn:#e2b04a; --warn-soft:#42341a;
  --bar-actual:#3987e5; --bar-over:#e66767; --bar-recruit:#4f6f95; --pat:#eef1f3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;padding-inline:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:6px}
.tabs::before{content:"表示月";align-self:center;font-size:12px;color:var(--ink-3);margin-right:4px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:6px 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.pat{width:14px;height:0;border-top:2px solid var(--pat);border-radius:0}
h2{font-size:15px;margin:28px 0 10px;color:var(--ink-2);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .name{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.card .name small{font-weight:400;color:var(--ink-3);font-size:12px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;color:var(--ink-2)}
.kv b{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.5}
.pill.over{background:var(--over-soft);color:var(--over)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.under{background:var(--under-soft);color:var(--under)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:var(--surface-2);color:var(--ink-2)}
section.store{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
section.store .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
section.store h3{margin:0;font-size:18px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.stats b{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.chart{margin-top:12px;overflow-x:auto}
.chart svg{display:block;min-width:640px;width:100%;height:auto}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--ink-2)}
.chart .grid line{stroke:var(--line-soft);stroke-width:1}
.chart .axis line{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--bar-actual)}
.chart .bar.rec{fill:var(--bar-recruit)}
.chart .bar.ov{fill:var(--bar-over)}
.chart .pat{stroke:var(--pat);stroke-width:2}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--accent-soft);opacity:.6}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;white-space:pre;z-index:9;display:none;font-family:var(--mono)}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--ink-3);text-align:left;font-size:11px;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
td:nth-child(1),td:nth-child(2),td:nth-child(8){white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.over td:first-child{box-shadow:inset 3px 0 0 var(--over)}
tr.under td:first-child{box-shadow:inset 3px 0 0 var(--under)}
tr.none td{color:var(--ink-3)}
td.ranges{color:var(--ink-2);font-size:12px;min-width:200px}
td.ranges .r{display:inline-block;margin:0 8px 2px 0;white-space:nowrap}
td.ranges .r.o{color:var(--over)}
td.ranges .r.u{color:var(--under)}
.review{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.rv{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink-2);background:var(--bg)}
.rv .t{display:flex;justify-content:space-between;font-size:13px;color:var(--ink);font-weight:500;margin-bottom:2px}
.rv b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.rv.flag{border-color:var(--warn);background:var(--warn-soft)}
.note{font-size:12px;color:var(--ink-3);margin-top:10px}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:8px}
.empty{color:var(--ink-3);padding:12px 0}
@media (max-width:600px){h1{font-size:19px}.card{padding:10px 12px}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>シフトチェック</h1>

</div>

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtH = v => (Math.round(v*100)/100).toLocaleString('ja-JP', {maximumFractionDigits:2}) + 'h';
const fmtD = v => (v>0?'+':'') + (Math.round(v*100)/100).toLocaleString('ja-JP', {maximumFractionDigits:2}) + 'h';
const fmtY = v => v==null ? '-' : Math.round(v).toLocaleString('ja-JP') + '円';
const months = Object.keys(DATA.months).sort();
// 初期表示 = 今月(あれば)。無ければ最新の月
const now = new Date(); const thisYm = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
let cur = DATA.months[thisYm] ? thisYm : months[months.length-1];
try { const s = localStorage.getItem('shiftcheck.month'); if (s && DATA.months[s]) cur = s; } catch(e){}

function summarize(st){
  const made = st.days.filter(d => d.has_shift);
  const over = made.filter(d => d.diff_h > 0);
  const budget = st.days.filter(d => d.budget);
  const bflag = st.days.filter(d => d.budget_flag);
  const pat = made.reduce((a,d)=>a+d.pattern_h,0), act = made.reduce((a,d)=>a+d.actual_h,0), rec = made.reduce((a,d)=>a+d.recruit_h,0);
  const overH = made.reduce((a,d)=>a+d.over_h,0);
  const reviews = Object.entries(st.sales_review||{}).filter(([k,v])=>v.review).map(([k])=>k);
  return {made, over, budget, bflag, pat, act, rec, overH, reviews};
}

function renderTabs(){
  const t = $('#tabs'); t.innerHTML = '';
  months.forEach(ym => {
    const b = document.createElement('button');
    b.className='tab'; b.role='tab'; b.id='tab-'+ym; b.setAttribute('aria-selected', ym===cur);
    b.textContent = ym.slice(0,4)+'年'+parseInt(ym.slice(5))+'月';
    b.onclick = () => { cur = ym; try{localStorage.setItem('shiftcheck.month', ym)}catch(e){}; render(); };
    t.appendChild(b);
  });
}

function renderOverview(m){
  const g = $('#overview'); g.innerHTML='';
  DATA.order.forEach(code => {
    const st = m.stores[code]; if(!st) return;
    const s = summarize(st);
    const el = document.createElement('button'); el.className='card'; el.id='card-'+code;
    el.onclick = () => document.getElementById('store-'+code).scrollIntoView({behavior:'smooth', block:'start'});
    let status;
    if (!s.made.length) status = '<span class="pill mute">未作成</span>';
    else if (s.over.length === 0) status = '<span class="pill ok">超過なし</span>';
    else status = `<span class="pill over">超過 ${s.over.length}/${s.made.length}日</span>`;
    el.innerHTML = `<div class="name"><span>${esc(st.name)}</span><small>作成 ${s.made.length}/${st.days.length}日</small></div>
      <div>${status} ${s.reviews.length ? `<span class="pill warn">見直し候補: ${esc(s.reviews.join('・'))}</span>` : ''}</div>
      <div class="kv">
        <span>作成 − パターン(合計)</span><b>${s.made.length ? fmtD(s.act - s.pat) : '-'}</b>
        <span>時間帯の過剰(人時)</span><b>${s.made.length ? fmtH(s.overH) : '-'}</b>
        <span>うち募集枠</span><b>${s.made.length ? fmtH(s.rec) : '-'}</b>
        <span>売上予算がパターン帯と不一致</span><b>${s.budget.length ? s.bflag.length + '/' + s.budget.length + '日' : '-'}</b>
      </div>`;
    g.appendChild(el);
  });
}

function chart(st){
  const days = st.days, n = days.length;
  const W = 1000, H = 190, L = 34, R = 8, T = 12, B = 26;
  const pw = W - L - R, ph = H - T - B;
  const maxV = Math.max(10, ...days.map(d => Math.max(d.actual_h, d.pattern_h))) * 1.08;
  const y = v => T + ph - v/maxV*ph;
  const slot = pw / n, bw = Math.max(6, slot*0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(st.name)} 日別のパターン時間と作成シフト時間">`;
  s += '<g class="grid">';
  const step = maxV > 60 ? 20 : 10;
  for (let v = 0; v <= maxV; v += step) s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  s += '</g>';
  days.forEach((d,i) => {
    const x = L + slot*i + (slot-bw)/2;
    const base = Math.min(d.actual_h, d.pattern_h);
    const staffPart = Math.min(d.staff_h, base);
    if (d.has_shift){
      if (staffPart > 0) s += `<rect class="bar" x="${x}" y="${y(staffPart)}" width="${bw}" height="${y(0)-y(staffPart)}" rx="2"/>`;
      if (base > staffPart) s += `<rect class="bar rec" x="${x}" y="${y(base)}" width="${bw}" height="${y(staffPart)-y(base)-1}"/>`;
      if (d.actual_h > d.pattern_h) s += `<rect class="bar ov" x="${x}" y="${y(d.actual_h)}" width="${bw}" height="${y(d.pattern_h)-y(d.actual_h)-1}" rx="2"/>`;
    }
    s += `<line class="pat" x1="${x-2}" x2="${x+bw+2}" y1="${y(d.pattern_h)}" y2="${y(d.pattern_h)}"/>`;
    const lbl = d.day + (d.holiday ? '祝' : '');
    const wk = ['土','日'].includes(d.wd) || d.holiday;
    s += `<text x="${x+bw/2}" y="${H-10}" text-anchor="middle"${wk?' font-weight="600"':''}>${lbl}</text>`;
    s += `<rect class="hit" x="${L+slot*i}" y="${T}" width="${slot}" height="${ph}" data-i="${i}"/>`;
  });
  s += `<g class="axis"><line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/></g></svg>`;
  return s;
}

function rangesHtml(d){
  let h = '';
  d.over_ranges.forEach(([a,b,v]) => h += `<span class="r o">${a}–${b} +${v}人</span>`);
  if (d.out_of_grid_min) h += `<span class="r o">枠外 ${fmtH(d.out_of_grid_min/60)}</span>`;
  d.under_ranges.forEach(([a,b,v]) => h += `<span class="r u">${a}–${b} −${v}人</span>`);
  return h || '<span class="r">—</span>';
}

function renderStores(m){
  const root = $('#stores'); root.innerHTML='';
  DATA.order.forEach(code => {
    const st = m.stores[code]; if(!st) return;
    const s = summarize(st);
    const sec = document.createElement('section'); sec.className='store'; sec.id='store-'+code;
    const blocks = st.blocks.map(b => `${b.daytype} ${b.hours}h/${fmtY(b.sales_hi)}`).join(' ・ ');
    let head = `<div class="head"><h3>${esc(st.name)}</h3><div class="stats">`;
    if (s.made.length){
      head += `<span>作成 <b>${s.made.length}</b>日</span><span>超過日 <b>${s.over.length}</b></span><span>合計差 <b>${fmtD(s.act-s.pat)}</b></span><span>過剰人時 <b>${fmtH(s.overH)}</b></span><span>募集枠 <b>${fmtH(s.rec)}</b></span>`;
    } else head += '<span>この月のシフトは未作成</span>';
    head += `</div></div><div class="note">パターン: ${esc(blocks)}</div>`;
    const vers = st.pattern_versions_in_month || [];
    if (vers.length > 1) head += `<div class="note"><span class="pill warn">パターン変更あり</span> ${vers.slice(1).map(v => v.replace(/^\d+-0?(\d+)-0?(\d+)$/, '$1/$2') + '以降は新パターンで判定').join('、')}(それ以前は変更前のパターン)</div>`;
    let body = '';
    if (s.made.length){
      body += `<div class="chart" data-code="${code}">${chart(st)}</div>`;
      body += `<div class="tablewrap"><table><thead><tr><th>日</th><th>区分</th><th class="n">パターン</th><th class="n">作成</th><th class="n">差</th><th>過剰 / 不足の時間帯</th><th class="n">売上予算</th><th>予算の帯</th><th class="n">ダイニー人件費率</th></tr></thead><tbody>`;
      st.days.forEach(d => {
        const cls = !d.has_shift ? 'none' : d.diff_h > 0 ? 'over' : d.diff_h < 0 ? 'under' : '';
        const band = d.budget_flag ? `<span class="pill warn" title="${esc(d.budget_flag)}">${esc(d.budget_flag.match(/は(.+?)パターン帯/)?.[1] || '不一致')}帯</span>` : (d.budget ? '<span class="pill ok">一致</span>' : '—');
        body += `<tr class="${cls}"><td>${d.day}(${d.wd}${d.holiday?'祝':''})</td><td>${d.pattern_daytype}</td><td class="n">${fmtH(d.pattern_h)}</td><td class="n">${d.has_shift?fmtH(d.actual_h):'—'}${d.recruit_h?`<br><small style="color:var(--ink-3)">募集 ${fmtH(d.recruit_h)}</small>`:''}</td><td class="n" style="color:${d.diff_h>0?'var(--over)':d.diff_h<0?'var(--under)':'inherit'}">${d.has_shift?fmtD(d.diff_h):'—'}</td><td class="ranges">${d.has_shift?rangesHtml(d):'—'}</td><td class="n">${fmtY(d.budget)}<br><small style="color:var(--ink-3)">予測 ${fmtY(d.pattern_sales)}</small></td><td>${band}</td><td class="n">${d.dinii_rate!=null?d.dinii_rate.toFixed(1)+'%':'—'}</td></tr>`;
      });
      body += '</tbody></table></div>';
    } else if (s.budget.length){
      body += `<div class="empty">売上予算は入力済み(${s.budget.length}日)。パターン帯と不一致 ${s.bflag.length}日。</div>`;
      if (s.bflag.length) body += '<details><summary>不一致の日を表示</summary><ul>' + s.bflag.map(d=>`<li>${d.day}(${d.wd}) ${esc(d.budget_flag)}</li>`).join('') + '</ul></details>';
    }
    const rv = st.sales_review || {};
    if (Object.keys(rv).length){
      body += '<div class="review">';
      Object.entries(rv).forEach(([k,v]) => {
        body += `<div class="rv ${v.review?'flag':''}"><div class="t"><span>${k}</span><span>${v.review?'見直し候補':(v.above_all?'全日が予測超え':'')}</span></div>予測 <b>${fmtY(v.forecast)}</b> ／ 実績平均 <b>${fmtY(v.avg)}</b><br>下回り <b>${v.n_below}/${v.n}</b>日 ・ 直近連続 <b>${v.streak_below}</b>回</div>`;
      });
      body += '</div>';
    }
    sec.innerHTML = head + body;
    root.appendChild(sec);
  });
  // hover
  const tip = $('#tip');
  root.querySelectorAll('.chart').forEach(ch => {
    const st = m.stores[ch.dataset.code];
    ch.addEventListener('mousemove', e => {
      const t = e.target.closest('.hit'); if(!t){tip.style.display='none';return;}
      const d = st.days[+t.dataset.i];
      tip.textContent = `${d.day}(${d.wd}${d.holiday?'祝':''}) ${d.pattern_daytype}\nパターン ${fmtH(d.pattern_h)}\n作成     ${d.has_shift?fmtH(d.actual_h):'—'}${d.recruit_h?` (募集 ${fmtH(d.recruit_h)})`:''}\n差       ${d.has_shift?fmtD(d.diff_h):'—'}`;
      tip.style.display='block'; tip.style.left = Math.min(e.clientX+14, innerWidth-220)+'px'; tip.style.top = (e.clientY+14)+'px';
    });
    ch.addEventListener('mouseleave', () => tip.style.display='none');
  });
}

function render(){
  const m = DATA.months[cur];
  $('#subtitle').textContent = `${cur.slice(0,4)}年${parseInt(cur.slice(5))}月 ・ 作成 ${m.generated} ・ パターン表 × ダイニー シフト表`;
  renderTabs(); renderOverview(m); renderStores(m);
}
render();
</script>
</body></html>
