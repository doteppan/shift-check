<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>レーバーマネジメント</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f4f2; --surface:#ffffff; --surface-2:#e9ebe8; --line:#d8dcd9; --line-soft:#e6e9e6;
  --ink:#1b232c; --ink-2:#4f5963; --ink-3:#7b858f;
  --accent:#1f5fa8; --accent-soft:#dce8f7;
  --over:#c93f3a; --over-soft:#f7dedb; --under:#3f7fc4; --ok:#2f8a5b; --ok-soft:#dcefe3; --warn:#b9770e; --warn-soft:#f6e9cf;
  --bar-plan:#b9c7d8; --bar-act:#2a78d6; --line-rate:#e8962e; --line-plan-rate:#1b232c;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191d; --surface:#1e2429; --surface-2:#262d33; --line:#38424b; --line-soft:#2c343b;
    --ink:#eef1f3; --ink-2:#b7c0c8; --ink-3:#87919b; --accent:#6ea7ea; --accent-soft:#1f2f45;
    --over:#ef7b74; --over-soft:#4a2320; --under:#7fb2ea; --ok:#6cc292; --ok-soft:#1d3a2a; --warn:#e2b04a; --warn-soft:#42341a;
    --bar-plan:#4a5a6e; --bar-act:#3987e5; --line-rate:#f0a84a; --line-plan-rate:#eef1f3;
  }
}
:root[data-theme="dark"]{
  --bg:#15191d; --surface:#1e2429; --surface-2:#262d33; --line:#38424b; --line-soft:#2c343b;
  --ink:#eef1f3; --ink-2:#b7c0c8; --ink-3:#87919b; --accent:#6ea7ea; --accent-soft:#1f2f45;
  --over:#ef7b74; --over-soft:#4a2320; --under:#7fb2ea; --ok:#6cc292; --ok-soft:#1d3a2a; --warn:#e2b04a; --warn-soft:#42341a;
  --bar-plan:#4a5a6e; --bar-act:#3987e5; --line-rate:#f0a84a; --line-plan-rate:#eef1f3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;letter-spacing:.01em}
.sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:6px 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:12px 0 4px;font-size:13px;color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:3px 11px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin:8px 0}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:4px}
.sw.l{width:14px;height:0;border-top:2px solid var(--line-rate);border-radius:0}
.sw.lp{width:14px;height:0;border-top:2px dashed var(--line-plan-rate);border-radius:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card:hover{border-color:var(--accent)}
.card .nm{font-weight:700;font-size:15px}
.card .kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.card .kv b{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.5}
.pill.over{background:var(--over-soft);color:var(--over)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.mute{background:var(--surface-2);color:var(--ink-2)}
section.store{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
section.store .head{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;height:40px;margin:-16px -16px 0;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line-soft);border-radius:12px 12px 0 0}
section.store h3{margin:0;font-size:18px}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.links a{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--surface)}
.links a:hover{background:var(--accent-soft)}
.links a.sheet::before{content:"▦ "}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);margin-top:10px}
.stats b{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--ink-3);margin-top:6px;white-space:pre-wrap}
.chart{margin-top:12px;overflow-x:auto}
.chart svg{display:block;min-width:640px;width:100%;height:auto}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--ink-2)}
.chart .grid line{stroke:var(--line-soft)} .chart .axis line{stroke:var(--line)}
.chart rect.p{fill:var(--bar-plan)} .chart rect.a{fill:var(--bar-act)}
.chart polyline.r{fill:none;stroke:var(--line-rate);stroke-width:2} .chart polyline.pr{fill:none;stroke:var(--line-plan-rate);stroke-width:1.2;stroke-dasharray:4 3;opacity:.7}
.chart circle.r{fill:var(--line-rate)}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 6px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--ink-2);position:sticky;background:var(--surface);z-index:2}
/* 表は横スクロール枠(overflow)の中にあるので、見出しの固定位置は枠の上端基準(0/22px)。40px基準だと先頭行が隠れる */
thead tr.grp th{top:0;font-size:11px;letter-spacing:.04em;border-bottom:0;padding-bottom:0;color:var(--ink-3)}
thead tr.grp + tr th{top:22px}
thead tr.grp th.g{border-left:1px solid var(--line)}
td.g,th.g{border-left:1px solid var(--line)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
thead th:first-child{z-index:3}
td.num{font-family:var(--mono)}
td.wk{color:var(--over)} 
tr.tot td{font-weight:700;border-top:2px solid var(--line);background:var(--surface-2)}
tr.tot2 td,tr.tot3 td{font-weight:600;background:var(--surface-2)}
td.pos{color:var(--over)} td.neg{color:var(--ok)}
td.blank{color:var(--ink-3)}
.dt{display:none} .detail .dt{display:table-cell} .detail div.dt,.detail span.dt{display:inline}
.allwrap{overflow-x:auto}
small.ref{color:var(--ink-3)}
#totop{position:fixed;right:18px;bottom:18px;z-index:8;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 14px;font-size:13px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12);display:none}
#totop.show{display:block}
@media (max-width:600px){h1{font-size:19px}.card{padding:10px 12px}}
</style>
</head>

  <div id="body"></div>
</div>

}

function ratePill(v){
  if (v==null) return '<span class="pill mute">実績なし</span>';
  return `<span class="pill ${v > 0.30 ? 'over' : (v > 0.252 ? 'warn' : 'ok')}">${fp(v)}</span>`;
}

function render(){
  const m = DATA.months[cur];
  document.getElementById('subtitle').textContent = `${ymLabel(cur)} / 作成 ${DATA.generated} / シート: レーバーマネジメントシート`;
  // ナビ・チップ
  document.getElementById('nav').innerHTML = `<a class="tab" href="${DATA.shift_check_url}">シフトチェック</a><a class="tab" aria-selected="true">レーバー</a><a class="tab" href="${m.file_url}" target="_blank" rel="noopener">▦ スプレッドシート</a>`;
  document.getElementById('months').innerHTML = months.map(ym => `<button class="chip" aria-pressed="${ym===cur}" onclick="cur='${ym}';save();render()">${ymLabel(ym)}</button>`).join('');
  document.getElementById('scen').innerHTML = SC.map(([k,l]) => `<button class="chip" aria-pressed="${k===scen}" onclick="scen='${k}';save();render()">${l}</button>`).join('');
  document.getElementById('view').innerHTML = [['simple','簡易'],['detail','詳細(すべて)']].map(([k,l]) => `<button class="chip" aria-pressed="${k===view}" onclick="view='${k}';save();render()">${l}</button>`).join('');
  document.body.classList.toggle('detail', view==='detail');
  const scLabel = (SC.find(x=>x[0]===scen)||[])[1] || scen;
  let body = '';
  const calcs = {};
  m.order.forEach(code => { calcs[code] = calc(m.stores[code]); });
  // 店舗カード
  body += '<div class="cards">' + m.order.map(code => {
    const st = m.stores[code], t = calcs[code].t;
    return `<button class="card" onclick="document.getElementById('st-${code}').scrollIntoView({behavior:'smooth'})">
      <div class="nm">${esc(st.name)} ${ratePill(t.arate)}</div>
      <div class="kv"><span>プラン LABOR%(${esc(scLabel)})</span><b>${fp(t.rate)}</b></div>
      <div class="kv"><span>実績 LABOR%(${t.n}日分)</span><b>${fp(t.arate)}</b></div>
      <div class="kv"><span>月間予測 LABOR%</span><b>${fp(t.frate)}</b></div>
      <div class="kv"><span>月間予測 売上 / 労務費</span><b>${fy(t.fs)} / ${fy(t.flab)}</b></div>
      <div class="kv"><span>社員上乗せ(${fy(t.emp)}円÷予測売上)</span><b>${t.emp ? fpt(t.emp_pct).replace('+','+') : '-'}</b></div>
      <div class="kv"><span>実績入力</span><b>${st.has_mgmt ? t.n + '日' : 'タブ未作成'}</b></div>
    </button>`; }).join('') + '</div>';
  // 全店一覧
  body += '<section class="store"><div class="head"><h3>全店一覧</h3></div><div class="allwrap"><table><thead>'
    + '<tr class="grp"><th></th><th class="g" colspan="3">売上</th><th class="g" colspan="3">総時間数</th><th class="g" colspan="3">労務費</th><th class="g" colspan="4">LABOR%</th><th class="g">社員上乗せ</th><th class="g">シート</th></tr>'
    + '<tr><th>店舗</th><th class="g">プラン</th><th>実績(期間)</th><th>月間予測</th><th class="g">プラン</th><th>実績(期間)</th><th>月間予測</th><th class="g">プラン</th><th>実績(期間)</th><th>月間予測</th><th class="g">プラン</th><th>期間プラン</th><th>実績</th><th>月間予測</th><th class="g">予測売上比</th><th class="g">入力</th></tr></thead><tbody>';
  const G = {ps:0, as:0, fs:0, h:0, ah:0, fh:0, lab:0, al:0, flab:0, pps:0, plab:0, emp:0};
  m.order.forEach(code => {
    const st = m.stores[code], t = calcs[code].t;
    for (const k in G) G[k] += t[k] || 0;
    body += `<tr><td><a href="#st-${code}" style="color:inherit;text-decoration:none">${esc(st.name)}</a></td>`
      + td(t.ps, fy, 'g') + td(t.as, fy) + td(t.fs, fy) + td(t.h, fh, 'g') + td(t.ah, fh) + td(t.fh, fh)
      + td(t.lab, fy, 'g') + td(t.al, fy) + td(t.flab, fy)
      + td(t.rate, fp, 'g') + td(t.prate, fp) + `<td class="num">${ratePill(t.arate)}</td>` + td(t.frate, fp)
      + `<td class="num g">${t.emp ? fpt(t.emp_pct) : '-'}</td>`
      + `<td class="g" style="text-align:left">${st.links.mgmt ? `<a href="${st.links.mgmt}" target="_blank" rel="noopener">実績入力 ▦</a>` : '<span class="pill mute">タブ未作成</span>'} <a href="${st.links['plan_'+BASE]||m.file_url}" target="_blank" rel="noopener">プラン ▦</a></td></tr>`;
  });
  body += `<tr class="tot"><td>合計</td>${td(G.ps, fy, 'g')}${td(G.as||null, fy)}${td(G.fs, fy)}${td(G.h, fh, 'g')}${td(G.ah||null, fh)}${td(G.fh, fh)}${td(G.lab, fy, 'g')}${td(G.al||null, fy)}${td(G.flab, fy)}`
    + td(G.ps ? G.lab/G.ps : null, fp, 'g') + td(G.pps ? G.plab/G.pps : null, fp) + `<td class="num">${ratePill(G.as ? G.al/G.as : null)}</td>` + td(G.fs ? G.flab/G.fs : null, fp)
    + `<td class="num g">${G.emp && G.fs ? fpt(G.emp/G.fs) : '-'}</td><td class="g"></td></tr>`;
  body += '</tbody></table></div>'
    + `<div class="note">LABOR%=労務費÷売上(クルーのみ。社員人件費は「社員上乗せ」として別掲)。期間合計=実績が入力されている日だけの集計、月間予測=実績日は実績・未入力日はプランで月を通した見込み。${esc(DATA.employee_note||'')}</div></section>`;
  // 店舗別
  m.order.forEach(code => {
    const st = m.stores[code], c = calcs[code], t = c.t;
    const lk = Object.entries(st.links).map(([k,u]) => {
      const lab = k === 'mgmt' ? '実績入力(マネジメントシート)' : 'プラン ' + ((SC.find(x => 'plan_'+x[0]===k)||[])[1] || k);
      return `<a class="sheet" href="${u}" target="_blank" rel="noopener">${lab}</a>`; }).join('');
    body += `<section class="store" id="st-${code}"><div class="head"><h3>${esc(st.name)}</h3>${ratePill(t.arate)}<div class="links">${lk}<a href="#top">↑ トップへ</a></div></div>`;
    body += `<div class="stats"><span>プラン(${esc(scLabel)}) 売上 <b>${fy(t.ps)}</b> 時間 <b>${fh(t.h)}h</b> 労務費 <b>${fy(t.lab)}</b> LABOR% <b>${fp(t.rate)}</b></span>`
      + `<span>実績(${t.n}日) 売上 <b>${fy(t.as)}</b> 時間 <b>${fh(t.ah)}h</b> 労務費 <b>${fy(t.al)}</b> LABOR% <b>${fp(t.arate)}</b>(期間プラン ${fp(t.prate)})</span>`
      + `<span>月間予測 売上 <b>${fy(t.fs)}</b> 労務費 <b>${fy(t.flab)}</b> LABOR% <b>${fp(t.frate)}</b></span>`
      + (t.emp ? `<span>社員上乗せ <b>${fpt(t.emp_pct)}</b>(${fy(t.emp)}円÷予測売上)</span>` : '') + '</div>';
    if (!st.has_mgmt) body += '<div class="note">※ この店舗の「①マネジメントシート」タブがスプレッドシートにまだ無いため、実績入力は読めません(タブを複製して作ると翌日から反映)。</div>';
    if (st.note) body += `<div class="note dt">${esc(st.note)}</div>`;
    body += `<div class="chart">${chart(st, c.rows)}</div>`;
    body += storeTable(st, c);
    body += '</section>';
  });
  document.getElementById('body').innerHTML = body;
}
function save(){ try{ localStorage.setItem('labor.month', cur); localStorage.setItem('labor.scen', scen); localStorage.setItem('labor.view', view);}catch(e){} }
window.addEventListener('scroll', () => document.getElementById('totop').classList.toggle('show', window.scrollY > 400));
render();
</script>
</body>
</html>
